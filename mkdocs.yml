site_name: Documentation sécurité Linux
site_description: Documentation auditd, AppArmor et SELinux
site_url: https://vignemail1.github.io/auditd-doc/
repo_url: https://github.com/vignemail1/auditd-doc
repo_name: vignemail1/auditd-doc
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  logo: _assets/images/logo.png
  favicon: _assets/images/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Activer le mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Activer le mode clair

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - _assets/stylesheets/extra.css

nav:
  - Accueil: index.md
  - Fondamentaux: fondamentaux.md
  - Auditd:
      - Présentation: auditd/index.md
      - Installation: auditd/installation.md
      - Configuration: auditd/configuration.md
      - Règles: auditd/regles.md
      - Outils et analyse: auditd/outils.md
  - AppArmor:
      - Présentation: apparmor/index.md
      - Installation: apparmor/installation.md
      - Configuration: apparmor/configuration.md
      - Profils: apparmor/profils.md
      - Outils: apparmor/outils.md
  - SELinux:
      - Présentation: selinux/index.md
      - Installation: selinux/installation.md
      - Configuration: selinux/configuration.md
      - Politiques et contextes: selinux/politiques.md
      - Outils: selinux/outils.md
  - Cas pratiques: cas-pratiques.md
  - Automatisation: automatisation.md
  - Supervision: supervision.md
  - Comparaison: comparaison.md
  - Méthodologie: methodologie.md
  - Annexes:
      - Références: annexes/references.md
      - Glossaire: annexes/glossaire.md

copyright: Copyright &copy; vignemail1
