site_name: Documentation sécurité Linux
site_description: Documentation administrateur sur auditd, AppArmor et SELinux
site_author: auditd-doc
site_url: https://vignemail1.github.io/auditd-doc/

repo_name: vignemail1/auditd-doc
repo_url: https://github.com/vignemail1/auditd-doc
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Mode clair

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Fondamentaux: fondamentaux.md
  - Auditd:
      - Vue d'ensemble: auditd/index.md
      - Installation: auditd/installation.md
      - Configuration: auditd/configuration.md
      - Construction des règles: auditd/regles.md
      - Administration: auditd/administration.md
      - Outils CLI: auditd/outils.md
      - Dépannage: auditd/depannage.md
  - AppArmor:
      - Vue d'ensemble: apparmor/index.md
      - Installation: apparmor/installation.md
      - Profils et règles: apparmor/profils.md
      - Administration: apparmor/administration.md
      - Outils CLI: apparmor/outils.md
      - Dépannage: apparmor/depannage.md
  - SELinux:
      - Vue d'ensemble: selinux/index.md
      - Installation: selinux/installation.md
      - Politiques et règles: selinux/politiques.md
      - Administration: selinux/administration.md
      - Outils CLI: selinux/outils.md
      - Dépannage: selinux/depannage.md
  - Comparaison: comparaison.md
  - Cas pratiques: cas-pratiques.md
  - Méthodologie: methodologie.md
  - Automatisation: automatisation.md
  - Supervision: supervision.md
  - Annexes:
      - Commandes: annexes/commandes.md
      - Fichiers importants: annexes/fichiers.md
      - Glossaire: annexes/glossaire.md
      - Références: annexes/references.md
